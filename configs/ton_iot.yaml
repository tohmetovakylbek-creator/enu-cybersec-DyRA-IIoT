# configs/ton_iot.yaml
# ─────────────────────────────────────────────────────────────────────────────
# Dataset-specific overrides for TON_IoT (Section 4.10, Tables 18-22).
# Loaded automatically by scripts/train_all.py when --dataset ton_iot is used
# (or explicitly via --config configs/ton_iot.yaml).
# Any value present here overrides the corresponding default in
# dyra_iiot/config.py; keys not present fall back to those defaults.
# ─────────────────────────────────────────────────────────────────────────────

dataset: ton_iot

# Label column expected in the raw CSV (see scripts/train_all.py::load_dataset)
label_column: type

# OOD held-out attack categories — identical category set to Edge-IIoTset,
# but spelled the way they appear in TON_IoT (Section 4.10)
# — mirrors dyra_iiot.config.OOD_CLASSES_TON
ood_classes:
  - mitm
  - ransomware
  - backdoor
  - scanning

# Partitioning & windowing (Section 4.1.3-4.1.4) — same protocol as
# Edge-IIoTset, applied to TON_IoT's per-flow records
window_len: 50
train_ratio: 0.80

# Training protocol (Section 4.1.6)
batch_size: 64
epochs: 10
seeds: [42, 123, 456, 789, 2024]
